## Truth About IP Addresses

### What Your Server ALWAYS Sees (From Real Users)

| Network Type | User's Device IP | What Server Sees | Can Geolocate? |
|--------------|------------------|------------------|----------------|
| **Jio 4G** | 10.234.56.78 (private) | **103.127.45.67** (Jio's public) | ✅ Yes → Mumbai |
| **Airtel 5G** | 172.16.23.45 (private) | **106.51.87.234** (Airtel's public) | ✅ Yes → Mumbai |
| **WiFi (Home)** | 192.168.1.5 (private) | **49.37.128.90** (ISP's public) | ✅ Yes → Mumbai |
| **Office WiFi** | 10.0.0.15 (private) | **203.122.45.67** (Office ISP) | ✅ Yes → Pune |

### What You See During Local Testing

| Scenario | IP | Can Geolocate? | What Happens |
|----------|----|----|--------------|
| **Localhost** | 127.0.0.1 | ❌ No | Geo checks skipped (safe) |
| **LAN Testing** | 192.168.1.x | ❌ No | Geo checks skipped (safe) |

**Important:** Private IPs are only seen during local testing. Production users ALWAYS have public IPs.

        // Setup Markdown

        // 1. Extract diagrams to placeholders
        const mermaidBlocks = [];
        let diagramCount = 0;

        const contentWithPlaceholders = markdownContent.replace(
            /```mermaid\n([\s\S]*?)```/g,
            (match, code) => {
                const id = `mermaid-id-${diagramCount++}`;
                mermaidBlocks.push({ id, code: code.trim() });
                return `<div class="mermaid" id="${id}"></div>`;
            }
        );

        // 2. Render Markdown to HTML
        document.getElementById('content').innerHTML = marked.parse(contentWithPlaceholders);

        // 3. Render Mermaid Diagrams
        const initDiagrams = async () => {
            for (const block of mermaidBlocks) {
                const element = document.getElementById(block.id);
                try {
                    const { svg } = await mermaid.render(`${block.id}-svg`, block.code);
                    element.innerHTML = svg;
                } catch (e) {
                    console.error("Mermaid error:", e);
                    element.innerHTML = `<pre style="color:red">Error rendering diagram: ${e.message}</pre>`;
                }
            }
        };

        // Run
        setTimeout(initDiagrams, 100);

    </script>
